# Instale e rode no WSL: `make deps && pre-commit install`.
# Os hooks `language: script` dependem das ferramentas de scripts/setup-tools.sh.
# O job `lint` do CI roda exatamente esta configuração.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-d, -i, "2", -ci]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: no-kubeconfig
        name: kubeconfig não pode ser commitado
        language: fail
        entry: "kubeconfigs vivem em ~/.kube/, fora do repo"
        files: (^|/)(kubeconfig[^/]*|[^/]*\.kubeconfig)$

      - id: sops-encrypted
        name: arquivos *.sops.yaml estão criptografados
        language: script
        entry: scripts/check-sops-encrypted.sh
        # exclui o arquivo de configuração `.sops.yaml`
        files: (^|/)[^/.][^/]*\.sops\.yaml$

      - id: validate-manifests
        name: kubeconform + kube-linter em deploy/
        language: script
        entry: scripts/validate-manifests.sh
        pass_filenames: false
        files: ^deploy/
