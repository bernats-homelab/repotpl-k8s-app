server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Usado pelas probes do Deployment e pelos testes de CI.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
