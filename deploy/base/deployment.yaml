apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-template
spec:
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # usuário `nginx` da imagem nginx-unprivileged; ajuste ao trocar a imagem
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Resolvido por `images:` na kustomization (digest gravado pelo release).
          image: app-image
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # pid e arquivos temporários do nginx (raiz somente leitura)
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
