# KSOPS: o repo-server do ArgoCD descriptografa os arquivos abaixo no render, com a
# chave age do cluster. Para usar: crie o Secret, criptografe NO LUGAR
# (`sops encrypt --in-place deploy/base/<nome>.sops.yaml`), liste-o em `files` e
# descomente `generators:` na kustomization. Offline (pre-commit/CI), scripts/ksops-stub.py
# faz o papel do ksops com valores placeholder.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: app-template-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files: []
