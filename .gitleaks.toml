title = "repotpl-k8s-app"

[extend]
useDefault = true

[[rules]]
id = "age-private-key"
description = "Chave privada age (nunca deve sair de ~/.config/sops/age/keys.txt)"
regex = '''AGE-SECRET-KEY-1[0-9A-Z]{58}'''
keywords = ["age-secret-key"]

[[rules]]
id = "tailnet-name"
description = "Nome da tailnet (*.ts.net) identifica a rede privada"
regex = '''[a-z0-9-]+\.ts\.net'''
keywords = ["ts.net"]
